name: Docito checks

on:
  push:
    paths:
      - 'editor/**'
      - 'docito_editor_component.py'
      - 'app.py'
      - 'docito_*.py'
      - 'requirements*'
      - '.streamlit/config.toml'
      - 'tests/**'
      - '.github/workflows/editor-project-tests.yml'
  pull_request:
    paths:
      - 'editor/**'
      - 'docito_editor_component.py'
      - 'app.py'
      - 'docito_*.py'
      - 'requirements*'
      - '.streamlit/config.toml'
      - 'tests/**'
      - '.github/workflows/editor-project-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/project-files.test.cjs
      - run: node --check editor/editor.js && node --check editor/project-files.js
      - run: python -m py_compile app.py docito_auth.py docito_catalog.py docito_settings.py docito_editor_component.py
